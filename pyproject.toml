[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "essdive-mcp"
version = "0.3.5"
description = "MCP Server for ESS-DIVE API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
]

[project.scripts]
essdive-mcp = "essdive_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/essdive_mcp"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external ESS-DIVE / ESS-DeepDive services",
]
